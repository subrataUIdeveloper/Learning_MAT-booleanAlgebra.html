class Reverse{

 reverseNumber(n){
	let reversed = 0;

	while(n > 0){
		let lastDigit = n % 10;
		reversed = reversed * 10 + lastDigit;
		n = Math.floor(n/10);
 	}
		return reversed;
		
	}
}

class ReverseString{
	reverseString(str){
		let reversed = '';
		for(let i = str.length - 1; i >= 0; i--){
			reversed += str[i];
		}
		return reversed;
	}
}

class Palindrome{
	checkPalindrome(n){
	let reverseNumber = 0;
	let originalNumber = n;
	
	while(n > 0){
		let lastDigit = n % 10;
		reverseNumber = reverseNumber * 10 + lastDigit;
		n = Math.floor(n/10);
	}
	
		if(originalNumber === reverseNumber){
			return "The number is a palindrome.";
		}else{
			return "The number is not a palindrome.";
		}
	}
}

class GCD{
	findGCD(n1, n2){
		let gcd = 1;
		for(let i = 1; i <= Math.min(n1, n2); i++){
			if(n1 % i === 0 && n2 % i === 0){
				gcd = i;
			}
		}
		return gcd;
	}
}

const num2 = 18;

class amstrongNumber{
	
	findAmstrongNumber(n){
		let sum = 0;
		let originalNumber = n;
		let temp = n;
		let countDight = originalNumber === 0 ? 1 : Math.floor(Math.log10(originalNumber) + 1);
		// let countDight = originalNumber.toString().length;

		while(temp > 0){
			let lastDigit = temp % 10;
			sum += Math.pow(lastDigit, countDight);
			temp = Math.floor(temp/10);
		}
		if(sum === originalNumber){
			return "The number is an Amstrong number.";
		}else{
			return "The number is not an Amstrong number.";
		}
		}
	}

const amstrongObj =  new amstrongNumber();

class Divisor{
	
	findDivisor(n){
		let divisors = [];
		for(let i = 1; i <= n; i++){
			if(n % i === 0){
				divisors.push(i);
			}
		}
		return divisors;
	}	
}

class PrimeNumber{
	primeCheck(n){
		let count = 0;
		for(let i = 1; i <= n; i++){
			if(n % i === 0){
				count++;
			}
		}
		if(count === 2){
			return "The number is a prime number.";
		}else if(n < 1){
			return "The number is not a prime number.";
		}else{
			return "The number is not a prime number.";
		}
	}
}
